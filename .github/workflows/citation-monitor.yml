# AI 인용 모니터링 — 매주 월요일 KST 10:00
# 거래처별 타깃 질의를 AI 검색(Perplexity)에 실제로 던져 인용 여부를 리포트로 커밋.
# PERPLEXITY_API_KEY Secret이 없으면 수동 점검용 체크리스트만 생성.
name: AI Citation Monitor

on:
  # 주간 자동 실행 중지 (2026-11-12): PERPLEXITY_API_KEY 만료(401) 상태라 매주 실패 이슈만 생김.
  # 키를 새로 등록하면 아래 두 줄의 주석을 풀어 다시 켠다. 그 전에는 Actions에서 수동 실행만 가능.
  # schedule:
  #   - cron: '0 1 * * 1'   # 매주 월 KST 10:00 (UTC 01:00)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 인용 점검 실행
        id: check
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          CITATION_RUNS: '3'
        # API 오류가 있어도 리포트는 커밋하고, 마지막 단계에서 실패 처리해 알림 이슈를 만든다
        run: node scripts/check-citations.js || echo "api_error=true" >> "$GITHUB_OUTPUT"

      - name: 리포트 커밋
        run: |
          git config user.name "citation-bot"
          git config user.email "actions@github.com"
          # 원격 변경을 먼저 반영한 뒤 커밋 (commit→rebase 순서는 원격 변경 시 실패 가능)
          git pull --rebase --autostash origin main
          git add reports/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "report: AI 인용 모니터링 $(date -u +%Y-%m-%d)"
            git push origin main
          fi

      - name: API 오류 시 실패 처리
        if: steps.check.outputs.api_error == 'true'
        run: |
          echo "::error::Perplexity API 오류 — 키 만료·한도를 확인하세요. 이번 리포트의 오류 행은 미인용이 아니라 측정 실패입니다."
          exit 1

      - name: 실패 알림 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[자동] AI Citation Monitor 실패 — ' + new Date().toISOString().slice(0, 10),
              body: '워크플로 실행이 실패했습니다. 실행 로그: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
            });
